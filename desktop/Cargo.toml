[package]
name = "privacy-music"
version = "3.0.0"
edition = "2021"
description = "Privacy Music for desktop: a private YouTube Music client"
license = "GPL-3.0-or-later"
exclude = ["packaging", "target"]

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "lib"] }
rustypipe = "0.11.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "charset", "http2", "stream", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
symphonia = { version = "0.5", default-features = false, features = ["mkv", "isomp4", "aac", "mp3", "ogg", "flac", "wav", "pcm", "vorbis"] }
opus = "0.3"
cpal = "0.15"
souvlaki = "0.9"
aes-gcm = "0.11"
rand = "0.9"
directories = "6"
anyhow = "1"
futures = "0.3"
parking_lot = "0.12"
once_cell = "1"
regex = "1"
base64 = "0.22"
urlencoding = "2"
crossbeam-channel = "0.5"
sha2 = "0.10"
rfd = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
flate2 = "1"
# Devices nearby (encrypted LAN link): P-256 ECDH + HKDF-SHA256 + AES-256-GCM, same primitives as the phone.
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_16"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true

# muda without libxdo (only used for X11 keyboard shortcuts of predefined menu items, which we do not use).
[patch.crates-io]
muda = { path = "vendor/muda" }
tray-icon = { path = "vendor/tray-icon" }
